pre-commit:
  parallel: true
  commands:
    hygiene:
      run: python3 scripts/check-repo-hygiene.py
    modularity:
      run: python3 scripts/check-modularity.py
    connector:
      run: python3 scripts/validate-connector.py
    biome-lint:
      run: npx biome lint src
    contrast:
      run: python3 scripts/audit-theme-contrast.py
    secretlint:
      run: npx secretlint "**/*"
