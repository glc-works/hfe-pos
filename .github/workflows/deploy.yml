name: POS Suite Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Pilih Target Deployment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Run Canonical CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Canonical CI Gate (Hygiene, Modularity, Manifest, Typecheck, Lint, Secretlint, Tests, Build, Size)
        run: npm run ci

  deploy-preview:
    name: Deploy to PREVIEW (prv-pos.hfeit.com & prv-pos.hfeit.app)
    needs: test-and-lint
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix packages/storefront-astro

      - name: Build Astro Landing (Preview)
        env:
          ASTRO_SITE: 'https://prv-pos.hfeit.com'
          PUBLIC_APP_URL: 'https://prv-pos.hfeit.app'
          PUBLIC_IS_PREVIEW: 'true'
        run: npm run build --prefix packages/storefront-astro

      - name: Build React POS App (Preview - Connected to Hfe Core Preview)
        env:
          VITE_HFE_CORE_URL: 'https://prv-core.hfeit.com'
          VITE_IS_PREVIEW: 'true'
        run: npm run build

      - name: Deploy Landing to Cloudflare Pages (pos-landing)
        uses: cloudflare/wrangler-action@f90766113b2909a365287ebbc4d97a67eb3f1244 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/storefront-astro/dist --project-name=pos-landing --branch=main

      - name: Deploy App to Cloudflare Pages (pos-app)
        uses: cloudflare/wrangler-action@f90766113b2909a365287ebbc4d97a67eb3f1244 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pos-app --branch=main

  deploy-production:
    name: 🚀 Manual Promotion to PRODUCTION (pos.hfeit.com & pos.hfeit.app)
    needs: test-and-lint
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix packages/storefront-astro

      - name: Build Astro Landing (Production)
        env:
          ASTRO_SITE: 'https://pos.hfeit.com'
          PUBLIC_APP_URL: 'https://pos.hfeit.app'
          PUBLIC_IS_PREVIEW: 'false'
        run: npm run build --prefix packages/storefront-astro

      - name: Build React POS App (Production - Connected to Hfe Core Prod)
        env:
          VITE_HFE_CORE_URL: 'https://core.hfeit.com'
          VITE_IS_PREVIEW: 'false'
        run: npm run build

      - name: Deploy Landing to Cloudflare Pages (pos-landing)
        uses: cloudflare/wrangler-action@f90766113b2909a365287ebbc4d97a67eb3f1244 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/storefront-astro/dist --project-name=pos-landing --branch=production

      - name: Deploy App to Cloudflare Pages (pos-app)
        uses: cloudflare/wrangler-action@f90766113b2909a365287ebbc4d97a67eb3f1244 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pos-app --branch=production

