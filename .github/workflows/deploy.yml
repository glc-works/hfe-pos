name: POS Suite Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Pilih Target Deployment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Run Canonical CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Canonical CI Gate (Hygiene, Modularity, Manifest, Typecheck, Lint, Secretlint, Tests, Build, Size)
        run: npm run ci

      - name: Install Chromium for bounded pre-deploy browser gates
        run: npx playwright install --with-deps chromium

      - name: Verify flagship durable CORE contract fixture
        run: npm run test:flagship

      - name: Verify connected owner and social callback entry
        env:
          VITE_HFE_RUNTIME_MODE: connected
          VITE_TOGROW_URL: /id
          VITE_HFE_CORE_URL: /core
          VITE_HFE_COMPANY_BOOK_URL: http://localhost:8081
          VITE_TOGROW_ORGANIZATION_ID: 00000000-0000-4000-8000-000000000001
          VITE_TOGROW_CLIENT_ID: flagship-pos-ci
          VITE_TOGROW_SOCIAL_PROVIDERS: google,apple
          VITE_HFE_BOOK_ID: 00000000-0000-4000-8000-000000000002
          VITE_HFE_AUTHORITY_CONTEXT_ID: 00000000-0000-4000-8000-000000000003
          VITE_HFE_BRANCH_ID: 00000000-0000-4000-8000-000000000004
          VITE_HFE_CASHIER_SESSION_ID: 00000000-0000-4000-8000-000000000005
          VITE_HFE_FLAGSHIP_PRODUCT_ID: 00000000-0000-4000-8000-000000000006
        run: npm run test:connected-auth

  deploy-preview:
    name: Deploy to PREVIEW (prv-pos.hfeit.com & prv-pos.hfeit.app)
    needs: test-and-lint
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'preview')
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix packages/storefront-astro --legacy-peer-deps

      - name: Build Astro Landing (Preview)
        env:
          ASTRO_SITE: 'https://prv-pos.hfeit.com'
          PUBLIC_APP_URL: 'https://prv-pos.hfeit.app'
          PUBLIC_IS_PREVIEW: 'true'
        run: npm run build --prefix packages/storefront-astro

      - name: Build React POS App (Preview - Connected to Hfe Core Preview)
        env:
          VITE_HFE_RUNTIME_MODE: connected
          VITE_TOGROW_URL: /id
          VITE_HFE_CORE_URL: /core
          VITE_HFE_COMPANY_BOOK_URL: ${{ vars.HFE_COMPANY_BOOK_URL || 'https://prv-core.hfeit.com' }}
          VITE_TOGROW_ORGANIZATION_ID: ${{ vars.TOGROW_ORGANIZATION_ID || '00000000-0000-4000-8000-000000000001' }}
          VITE_TOGROW_CLIENT_ID: ${{ vars.TOGROW_CLIENT_ID || 'prv-pos-app' }}
          VITE_TOGROW_SOCIAL_PROVIDERS: ${{ vars.TOGROW_SOCIAL_PROVIDERS || 'google,apple' }}
          VITE_HFE_BOOK_ID: ${{ vars.HFE_BOOK_ID || '00000000-0000-4000-8000-000000000002' }}
          VITE_HFE_AUTHORITY_CONTEXT_ID: ${{ vars.HFE_AUTHORITY_CONTEXT_ID || '00000000-0000-4000-8000-000000000003' }}
          VITE_HFE_BRANCH_ID: ${{ vars.HFE_BRANCH_ID || '00000000-0000-4000-8000-000000000004' }}
          VITE_HFE_CASHIER_SESSION_ID: ${{ vars.HFE_CASHIER_SESSION_ID || '00000000-0000-4000-8000-000000000005' }}
          VITE_HFE_FLAGSHIP_PRODUCT_ID: ${{ vars.HFE_FLAGSHIP_PRODUCT_ID || '00000000-0000-4000-8000-000000000006' }}
          VITE_IS_PREVIEW: 'true'
        run: npm run guard:first-party-build && npm run build

      - name: Deploy Landing to Cloudflare Pages (pos-landing)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/storefront-astro/dist --project-name=pos-landing --branch=main

      - name: Deploy App to Cloudflare Pages (pos-app)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pos-app --branch=main

      - name: Verify deployed first-party proxy bindings
        run: |
          curl --fail --silent --show-error https://prv-pos.hfeit.app/id/health >/dev/null
          curl --fail --silent --show-error https://prv-pos.hfeit.app/core/health >/dev/null

  deploy-production:
    name: 🚀 Manual Promotion to PRODUCTION (pos.hfeit.com & pos.hfeit.app)
    needs: test-and-lint
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'production' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix packages/storefront-astro --legacy-peer-deps

      - name: Build Astro Landing (Production)
        env:
          ASTRO_SITE: 'https://pos.hfeit.com'
          PUBLIC_APP_URL: 'https://pos.hfeit.app'
          PUBLIC_IS_PREVIEW: 'false'
        run: npm run build --prefix packages/storefront-astro

      - name: Build React POS App (Production - Connected to Hfe Core Prod)
        env:
          VITE_HFE_RUNTIME_MODE: connected
          VITE_TOGROW_URL: /id
          VITE_HFE_CORE_URL: /core
          VITE_HFE_COMPANY_BOOK_URL: ${{ vars.HFE_COMPANY_BOOK_URL || 'https://core.hfeit.com' }}
          VITE_TOGROW_ORGANIZATION_ID: ${{ vars.TOGROW_ORGANIZATION_ID || '00000000-0000-4000-8000-000000000001' }}
          VITE_TOGROW_CLIENT_ID: ${{ vars.TOGROW_CLIENT_ID || 'pos-app' }}
          VITE_TOGROW_SOCIAL_PROVIDERS: ${{ vars.TOGROW_SOCIAL_PROVIDERS || 'google,apple' }}
          VITE_HFE_BOOK_ID: ${{ vars.HFE_BOOK_ID || '00000000-0000-4000-8000-000000000002' }}
          VITE_HFE_AUTHORITY_CONTEXT_ID: ${{ vars.HFE_AUTHORITY_CONTEXT_ID || '00000000-0000-4000-8000-000000000003' }}
          VITE_HFE_BRANCH_ID: ${{ vars.HFE_BRANCH_ID || '00000000-0000-4000-8000-000000000004' }}
          VITE_HFE_CASHIER_SESSION_ID: ${{ vars.HFE_CASHIER_SESSION_ID || '00000000-0000-4000-8000-000000000005' }}
          VITE_HFE_FLAGSHIP_PRODUCT_ID: ${{ vars.HFE_FLAGSHIP_PRODUCT_ID || '00000000-0000-4000-8000-000000000006' }}
          VITE_IS_PREVIEW: 'false'
        run: npm run guard:first-party-build && npm run build

      - name: Deploy Landing to Cloudflare Pages (pos-landing)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/storefront-astro/dist --project-name=pos-landing --branch=production

      - name: Deploy App to Cloudflare Pages (pos-app)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pos-app --branch=production

      - name: Verify deployed first-party proxy bindings
        run: |
          curl --fail --silent --show-error https://pos.hfeit.app/id/health >/dev/null
          curl --fail --silent --show-error https://pos.hfeit.app/core/health >/dev/null
