name: POS Suite Canonical CI Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  canonical-gate:
    name: Deterministic Quality & Security Gate (npm run ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Dependency Install
        run: npm ci

      - name: Run Canonical CI Gate (Hygiene, Modularity, Manifest, Typecheck, Lint, Secretlint, Tests, Build, Size)
        run: npm run ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Run POS Suite Playwright Smoke Gate (Issue #55)
        run: npm run test:smoke
