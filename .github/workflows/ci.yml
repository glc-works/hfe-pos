name: POS Suite Canonical CI Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  canonical-gate:
    name: Deterministic Quality & Security Gate (npm run ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Dependency Install
        run: npm ci

      - name: Run Canonical CI Gate (Hygiene, Modularity, Manifest, Typecheck, Lint, Secretlint, Tests, Build, Size)
        run: npm run ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Run POS Suite Playwright Smoke Gate (Issue #55)
        run: npm run test:smoke
